services:
  postgres:
    image: postgres:15-alpine
    container_name: open-video-studio-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_video_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - open-video-studio-net

  postgres_test:
    image: postgres:15-alpine
    container_name: open-video-studio-postgres-test
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_video_studio_test
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    networks:
      - open-video-studio-net

  redis:
    image: redis:7-alpine
    container_name: open-video-studio-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - open-video-studio-net

  minio:
    image: minio/minio:latest
    container_name: open-video-studio-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - open-video-studio-net

  omnivoice:
    image: ${OMNIVOICE_IMAGE:-omnivoice:latest}
    container_name: open-video-studio-omnivoice
    restart: always
    ports:
      - "8000:8000"
    networks:
      - open-video-studio-net

volumes:
  postgres-data:
  postgres-test-data:
  redis-data:
  minio-data:

networks:
  open-video-studio-net:
    driver: bridge
