services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_video_studio
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_video_studio"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - open-video-studio-postgres-data:/var/lib/postgresql/data

volumes:
  open-video-studio-postgres-data:
