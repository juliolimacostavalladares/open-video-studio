version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open_video_studio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data

  api:
    image: ghcr.io/juliolimacostavalladares/open-video-studio-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open_video_studio}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: open-video-studio
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: "true"
      OMNIVOICE_BASE_URL: ${OMNIVOICE_BASE_URL:-http://host.docker.internal:8000}
      AI_PROVIDER: ${AI_PROVIDER:-qwenproxy}
      QWENPROXY_BASE_URL: ${QWENPROXY_BASE_URL:-http://host.docker.internal:3000/v1}
      QWENPROXY_API_KEY: ${QWENPROXY_API_KEY:-sk-no-key-required}
      QWENPROXY_MODEL: ${QWENPROXY_MODEL:-qwen-plus}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI}
      YOUTUBE_MOCK_MODE: ${YOUTUBE_MOCK_MODE:-false}
      API_PORT: 4000
    labels:
      - "coolify.managed=true"
      - "coolify.port=4000"
      - "coolify.fqdn=${API_FQDN}"

  web:
    image: ghcr.io/juliolimacostavalladares/open-video-studio-web:latest
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 3000
    labels:
      - "coolify.managed=true"
      - "coolify.port=3000"
      - "coolify.fqdn=${WEB_FQDN}"

volumes:
  postgres-data:
  minio-data:
