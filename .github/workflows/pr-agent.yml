name: Qodo PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: self-hosted
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Resolve Stale PR-Agent Discussions
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Query GraphQL to list all unresolved review threads
            const query = `
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        comments(first: 1) {
                          nodes {
                            author {
                              login
                            }
                            body
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            try {
              const result = await github.graphql(query, { owner, repo, prNumber });
              const threads = result.repository.pullRequest.reviewThreads.nodes;
              console.log(`🔍 Found ${threads.length} total review threads. Checking for stale bot threads to resolve...`);

              for (const thread of threads) {
                if (thread.isResolved) continue;

                const comments = thread.comments.nodes;
                if (comments.length === 0) continue;

                const firstComment = comments[0];
                const author = firstComment.author ? firstComment.author.login : '';
                
                // Identify if the thread was started by the GitHub actions bot or belongs to PR-Agent
                const isBot = author === 'github-actions[bot]' || author === 'github-actions' || author.includes('pr-agent');
                const isPrAgentComment = firstComment.body && (
                  firstComment.body.includes('Suggestion:') || 
                  firstComment.body.includes('Suggested change') ||
                  firstComment.body.includes('pr-agent') ||
                  firstComment.body.includes('PR-Agent')
                );

                if (isBot || isPrAgentComment) {
                  console.log(`✅ Resolving stale bot review thread: ${thread.id}`);
                  const mutation = `
                    mutation($threadId: ID!) {
                      resolveReviewThread(input: {threadId: $threadId}) {
                        thread {
                          id
                          isResolved
                        }
                      }
                    }
                  `;
                  await github.graphql(mutation, { threadId: thread.id });
                }
              }
            } catch (error) {
              console.error('⚠️ Error resolving review threads:', error.message);
            }

      - name: PR Agent action
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI__KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI__API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CONFIG.MODEL: "openai/ag/claude-opus-4-6-thinking"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: 32000
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          PR_REVIEWER.PERSISTENT_COMMENT: "false"
          PR_CODE_SUGGESTIONS.PERSISTENT_COMMENT: "false"
          PR_CODE_SUGGESTIONS.COMMITABLE_CODE_SUGGESTIONS: "true"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "true"
