name: Qodo PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: self-hosted
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI__KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI__API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CONFIG.MODEL: "openai/ag/claude-opus-4-6-thinking"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: 32000
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          PR_REVIEWER.PERSISTENT_COMMENT: "false"
          PR_CODE_SUGGESTIONS.PERSISTENT_COMMENT: "false"
          PR_CODE_SUGGESTIONS.COMMITABLE_CODE_SUGGESTIONS: "true"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "true"

      # ─────────────────────────────────────────────────────────────────────────
      # Step 2: Parse review output → open GitHub Issues for every problem found,
      #         close issues that were resolved since the last push.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Create/Close Issues from PR-Agent Review
        if: github.event_name == 'pull_request' && steps.pragent.outputs.review != ''
        uses: actions/github-script@v6
        env:
          REVIEW_JSON: ${{ steps.pragent.outputs.review }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BRANCH: ${{ github.head_ref }}
        with:
          script: |
            const LABEL_NAME   = 'pr-agent-issue';
            const LABEL_COLOR  = 'd93f0b';
            const prNumber     = parseInt(process.env.PR_NUMBER);
            const prTitle      = process.env.PR_TITLE;
            const prUrl        = process.env.PR_URL;
            const prBranch     = process.env.PR_BRANCH;

            // ── 0. Ensure the label exists ────────────────────────────────────
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                name:  LABEL_NAME,
              });
            } catch (_) {
              await github.rest.issues.createLabel({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                name:        LABEL_NAME,
                color:       LABEL_COLOR,
                description: 'Opened automatically by PR-Agent review',
              });
            }

            // ── 1. Parse the PR-Agent review JSON ────────────────────────────
            let reviewData;
            try {
              reviewData = JSON.parse(process.env.REVIEW_JSON);
            } catch (e) {
              console.log('⚠️  Could not parse REVIEW_JSON:', e.message);
              return;
            }

            const review = reviewData.review || reviewData;
            console.log('Review keys:', Object.keys(review));

            // Collect all problem entries the review surfaced
            const problems = [];

            // security_concerns (string)
            const sec = review.security_concerns || '';
            if (sec && sec.toLowerCase().trim() !== 'no' &&
                sec.toLowerCase().trim() !== 'none' &&
                !sec.toLowerCase().includes('no security concerns')) {
              problems.push({ type: '🔐 Security Concern', detail: sec });
            }

            // insights / key_issues_to_review (array of objects)
            const insights = review.key_issues_to_review || review.insights || [];
            for (const item of insights) {
              const detail = item.insight || item.description || item.title || JSON.stringify(item);
              if (detail) problems.push({ type: '🔍 Key Issue', detail });
            }

            // general issues from possible_issues / issues fields
            const generalIssues = review.possible_issues || review.issues || [];
            for (const item of generalIssues) {
              const detail = item.issue || item.description || item.title || JSON.stringify(item);
              if (detail) problems.push({ type: '⚠️ Issue', detail });
            }

            console.log(`Found ${problems.length} problem(s) in review.`);

            // ── 2. Fetch existing open pr-agent-issues for this PR ────────────
            const existingIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                labels: LABEL_NAME,
                state:  'open',
              }
            );

            const prIssues = existingIssues.filter(i =>
              i.body && i.body.includes(`PR #${prNumber}`)
            );

            console.log(`Existing open issues for PR #${prNumber}: ${prIssues.length}`);

            // ── 3. Open a new issue for each problem ──────────────────────────
            const openedTitles = new Set();
            for (const p of problems) {
              const issueTitle = `[PR-Agent] ${p.type} in PR #${prNumber} — ${prTitle}`;

              // Avoid duplicates in same run
              if (openedTitles.has(issueTitle)) continue;
              openedTitles.add(issueTitle);

              // Check if an identical open issue already exists
              const duplicate = prIssues.find(i => i.title === issueTitle);
              if (duplicate) {
                console.log(`ℹ️  Issue already open: "${issueTitle}"`);
                continue;
              }

              const body = [
                `## ${p.type}`,
                '',
                p.detail,
                '',
                '---',
                `> **Source:** Automatic review by PR-Agent on push to \`${prBranch}\``,
                `> **PR:** [${prTitle}](${prUrl}) (#${prNumber})`,
                '',
                '_This issue will be closed automatically once PR-Agent no longer reports this problem on a subsequent push._',
              ].join('\n');

              const created = await github.rest.issues.create({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                title:  issueTitle,
                body,
                labels: [LABEL_NAME],
              });

              console.log(`✅ Opened issue #${created.data.number}: ${issueTitle}`);

              // Link the issue as a comment on the PR
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: prNumber,
                body: `🔗 PR-Agent abriu a issue **#${created.data.number}** para rastrear: **${p.type}**\n\n> ${p.detail.slice(0, 300)}${p.detail.length > 300 ? '…' : ''}\n\n_Resolva e faça um novo commit para fechar automaticamente._`,
              });
            }

            // ── 4. Close resolved issues (no longer reported by PR-Agent) ─────
            for (const issue of prIssues) {
              const stillOpen = [...openedTitles].some(t => t === issue.title);
              if (!stillOpen) {
                await github.rest.issues.update({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: issue.number,
                  state:        'closed',
                  state_reason: 'completed',
                });
                await github.rest.issues.createComment({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ Problema resolvido! PR-Agent não reportou mais este problema após novo push em \`${prBranch}\`. Issue fechada automaticamente.`,
                });
                console.log(`🔒 Closed resolved issue #${issue.number}`);
              }
            }

      # ─────────────────────────────────────────────────────────────────────────
      # Step 3: Auto-approve ONLY if no open pr-agent-issues remain for this PR
      # ─────────────────────────────────────────────────────────────────────────
      - name: Auto Approve Owner PR (Conditional)
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'juliolimacostavalladares' &&
          steps.pragent.outputs.review != ''
        uses: actions/github-script@v6
        env:
          REVIEW_JSON: ${{ steps.pragent.outputs.review }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const LABEL_NAME = 'pr-agent-issue';
            const prNumber   = parseInt(process.env.PR_NUMBER);

            // Check for open pr-agent-issues linked to this PR
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                labels: LABEL_NAME,
                state:  'open',
              }
            );

            const prOpenIssues = openIssues.filter(i =>
              i.body && i.body.includes(`PR #${prNumber}`)
            );

            if (prOpenIssues.length > 0) {
              console.log(`🚫 Auto-approve bloqueado: ${prOpenIssues.length} issue(s) aberta(s) pelo PR-Agent para este PR.`);
              console.log(prOpenIssues.map(i => `  #${i.number}: ${i.title}`).join('\n'));

              // Post a blocking comment on the PR
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: prNumber,
                body: [
                  '## 🚫 Auto-approve Bloqueado',
                  '',
                  `Existem **${prOpenIssues.length} issue(s) abertas** pelo PR-Agent que precisam ser resolvidas antes do merge:`,
                  '',
                  ...prOpenIssues.map(i => `- [ ] #${i.number} — ${i.title}`),
                  '',
                  '_Faça um commit resolvendo os problemas e o review será refeito automaticamente._',
                ].join('\n'),
              });
              return;
            }

            // Also check raw security_concerns from review JSON
            let hasSecurityConcerns = false;
            try {
              const reviewData = JSON.parse(process.env.REVIEW_JSON);
              const review = reviewData.review || reviewData;
              const sec = review.security_concerns || '';
              if (sec && sec.toLowerCase().trim() !== 'no' &&
                  sec.toLowerCase().trim() !== 'none' &&
                  !sec.toLowerCase().includes('no security concerns')) {
                hasSecurityConcerns = true;
                console.log('🚨 Security concerns detected in JSON:', sec);
              }
            } catch (e) {
              console.log('Could not parse review JSON for security check:', e.message);
            }

            if (hasSecurityConcerns) {
              console.log('⚠️  PR approval skipped due to security concerns.');
              return;
            }

            console.log('✅ Sem issues abertas e sem security concerns. Aprovando PR...');
            await github.rest.pulls.createReview({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: prNumber,
              event:       'APPROVE',
              body:        'Auto-aprovado: nenhum problema detectado pelo PR-Agent. ✅',
            });
