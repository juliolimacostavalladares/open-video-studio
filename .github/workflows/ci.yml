name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: self-hosted
    steps:
      - name: Prepare runner workspace
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            alpine sh -c '
              if [ -d /work ]; then
                chown -R $(stat -c "%u:%g" /work) /work || true
                find /work -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              fi
            ' || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation checks
        run: pnpm validate:ci

  e2e:
    name: E2E Tests
    runs-on: self-hosted
    needs: validate
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Prepare git safe directory
        run: git config --global --add safe.directory /__w/open-video-studio/open-video-studio

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project for E2E
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e
