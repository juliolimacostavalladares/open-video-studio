name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E tests in Playwright container
        run: |
          docker run --rm -v "$PWD":/work -w /work --network=host mcr.microsoft.com/playwright:v1.56.1-noble /bin/bash -lc "
            npm install -g pnpm@10.32.1 &&
            pnpm test:e2e;
            status=\$?;
            rm -rf test-results playwright-report;
            exit \$status
          "
