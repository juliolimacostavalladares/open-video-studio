name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate lockfile URLs and HTTPS registry
        run: pnpm lockfile-lint

      - name: Run ESLint
        run: pnpm lint

      - name: Run Build
        run: pnpm build

      - name: Deploy Database Migrations to Test DB
        run: DATABASE_URL="postgresql://postgres:postgres@localhost:5433/open_video_studio_test?schema=public" pnpm --filter @repo/database exec prisma migrate deploy

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run E2E Tests
        run: pnpm test:e2e

