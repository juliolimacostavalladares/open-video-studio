name: Auto Approve Owner PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  auto-approve:
    runs-on: self-hosted
    if: github.event.pull_request.user.login == 'juliolimacostavalladares'
    permissions:
      pull-requests: write
    steps:
      - name: Approve PR
        run: gh pr review "${{ github.event.pull_request.html_url }}" --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
