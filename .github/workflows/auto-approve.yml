name: Cometa do Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: auto-approve-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  approve:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Approve PR after successful CI
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER_FROM_PAYLOAD: ${{ github.event.workflow_run.pull_requests[0].number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Try to resolve PR number from event payload first
          PR_NUMBER="$PR_NUMBER_FROM_PAYLOAD"

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Payload PR_NUMBER is empty. Querying GitHub API for branch: $HEAD_BRANCH..."
            PR_NUMBER=$(curl --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/pulls?state=open&head=${REPOSITORY%/*}:$HEAD_BRANCH" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data[0]["number"] if data else "")')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Skipping auto-approve: no open PR found for branch $HEAD_BRANCH."
            exit 0
          fi

          echo "Approving PR #$PR_NUMBER..."
          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --data "$(python3 - <<'PY'
            import json
            import os

            print(json.dumps({
              "event": "APPROVE",
              "body": f"Cometa do Merge confirma a orbita: CI verde no commit {os.environ['HEAD_SHA']}. PR liberada para aterrissagem."
            }))
            PY
            )"
