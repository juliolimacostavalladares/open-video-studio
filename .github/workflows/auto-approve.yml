name: Cometa do Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: auto-approve-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  approve:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Approve PR after successful CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "Skipping auto-approve: no PR associated with this workflow run."
            exit 0
          fi

          gh pr review "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --approve \
            --body "Cometa do Merge confirma a orbita: CI verde no commit $HEAD_SHA. PR liberada para aterrissagem."
