name: Cometa do Merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: auto-approve-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    if: ${{ github.event.pull_request.user.login == 'juliolimacostavalladares' }}
    runs-on: self-hosted
    permissions:
      pull-requests: write
    steps:
      - name: Approve owner PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --data '{"event":"APPROVE","body":"Cometa do Merge entrou em orbita e deixou a aprovacao pronta."}'
