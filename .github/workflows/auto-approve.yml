name: Cometa do Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: auto-approve-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  approve:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Approve PR after successful CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Try to resolve PR number from event payload first
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"

          # If payload is empty or null, fetch using gh CLI
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Payload PR_NUMBER is empty. Querying GitHub API for branch: $HEAD_BRANCH..."
            PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --repo "$REPOSITORY" --state open --json number --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Skipping auto-approve: no open PR found for branch $HEAD_BRANCH."
            exit 0
          fi

          echo "Approving PR #$PR_NUMBER..."
          gh pr review "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --approve \
            --body "Cometa do Merge confirma a orbita: CI verde no commit $HEAD_SHA. PR liberada para aterrissagem."
