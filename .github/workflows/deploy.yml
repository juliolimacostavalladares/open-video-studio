name: CI/CD Deploy to Coolify

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Clean root-owned files via Docker
        run: |
          docker run --rm -v /home/github-runner/actions-runner/_work/open-video-studio/open-video-studio:/work -w /work alpine rm -rf apps/web/test-results apps/web/playwright-report apps/web/.next || true

  build-test-deploy:
    needs: cleanup
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vulnerability Audit
        run: pnpm audit --audit-level=high

      - name: Validate lockfile URLs and HTTPS registry
        run: pnpm lockfile-lint

      - name: Run ESLint
        run: pnpm lint

      - name: Run Build
        run: pnpm build

      - name: Start Docker Services
        run: |
          docker compose up -d postgres_test redis
          echo "Waiting for PostgreSQL to be ready..."
          until docker exec open-video-studio-postgres-test pg_isready -U postgres; do
            sleep 1
          done

      - name: Deploy Database Migrations to Test DB
        run: DATABASE_URL="postgresql://postgres:postgres@localhost:5433/open_video_studio_test?schema=public" pnpm --filter @repo/database exec prisma migrate deploy

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Run E2E Tests inside Playwright Docker Container
        run: |
          docker run --rm -v $(pwd):/work -w /work --network=host mcr.microsoft.com/playwright:v1.60.0-jammy /bin/bash -c "
            npm install -g pnpm@10.32.1 &&
            pnpm --filter web test:e2e;
            status=\$?;
            rm -rf apps/web/test-results apps/web/playwright-report apps/web/.next;
            exit \$status
          "

      - name: Stop Docker Services
        if: always()
        run: docker compose down

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- WEB APP DOCKER BUILD & PUSH ---
      - name: Extract metadata (tags, labels) for Web App
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/web
          tags: |
            type=raw,value=latest

      - name: Build and push Web App Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      # --- BACKEND DOCKER BUILD & PUSH ---
      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend-node/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # --- COOLIFY DEPLOY TRIGGER ---
      - name: Trigger Coolify Web App Redeploy Webhook
        env:
          COOLIFY_WEBHOOK_WEB: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        if: env.COOLIFY_WEBHOOK_WEB != ''
        run: |
          echo "Triggering Coolify Web App Redeploy Webhook..."
          curl -X POST "$COOLIFY_WEBHOOK_WEB" \
               -H "Authorization: Bearer $COOLIFY_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{}'

      - name: Trigger Coolify Backend Redeploy Webhook
        env:
          COOLIFY_WEBHOOK_BACKEND: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        if: env.COOLIFY_WEBHOOK_BACKEND != ''
        run: |
          echo "Triggering Coolify Backend Redeploy Webhook..."
          curl -X POST "$COOLIFY_WEBHOOK_BACKEND" \
               -H "Authorization: Bearer $COOLIFY_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{}'
