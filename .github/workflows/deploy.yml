name: Deploy to Coolify

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare runner workspace
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            alpine sh -c '
              if [ -d /work ]; then
                chown -R $(stat -c "%u:%g" /work) /work || true
                find /work -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              fi
            ' || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Derive image names
        id: image-meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/open-video-studio-web:latest
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/open-video-studio-web:${{ steps.image-meta.outputs.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/open-video-studio-api:latest
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/open-video-studio-api:${{ steps.image-meta.outputs.sha }}

      - name: Trigger Coolify Web redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_WEB: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_WEBHOOK_WEB" ]; then
            echo "Skipping web redeploy: COOLIFY_TOKEN or COOLIFY_WEBHOOK_WEB is not configured."
            exit 0
          fi

          RESPONSE=$(curl --write-out "\n%{http_code}" --silent --show-error \
            --request GET "$COOLIFY_WEBHOOK_WEB" \
            --header "Authorization: Bearer $COOLIFY_TOKEN")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response Body:"
          echo "$BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 202 ]; then
            echo "Error: Coolify API returned HTTP status $HTTP_STATUS"
            exit 1
          fi

          if echo "$BODY" | grep -q -i -E "<html|/login|redirect"; then
            echo "Error: Coolify returned login page or redirect. Please check your credentials and webhook URL."
            exit 1
          fi

      - name: Trigger Coolify API redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_BACKEND: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_WEBHOOK_BACKEND" ]; then
            echo "Skipping API redeploy: COOLIFY_TOKEN or COOLIFY_WEBHOOK_BACKEND is not configured."
            exit 0
          fi

          RESPONSE=$(curl --write-out "\n%{http_code}" --silent --show-error \
            --request GET "$COOLIFY_WEBHOOK_BACKEND" \
            --header "Authorization: Bearer $COOLIFY_TOKEN")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response Body:"
          echo "$BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 202 ]; then
            echo "Error: Coolify API returned HTTP status $HTTP_STATUS"
            exit 1
          fi

          if echo "$BODY" | grep -q -i -E "<html|/login|redirect"; then
            echo "Error: Coolify returned login page or redirect. Please check your credentials and webhook URL."
            exit 1
          fi
