name: Deploy to Coolify

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [master]

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Derive image names
        id: image-meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/open-video-studio-web:latest
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/open-video-studio-web:${{ github.event.workflow_run.head_sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/open-video-studio-api:latest
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/open-video-studio-api:${{ github.event.workflow_run.head_sha }}

      - name: Trigger Coolify Web App Redeploy Webhook
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_WEB: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
        if: ${{ env.COOLIFY_WEBHOOK_WEB != '' }}
        run: |
          curl --fail --show-error --request GET "$COOLIFY_WEBHOOK_WEB" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Trigger Coolify API Redeploy Webhook
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_BACKEND: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
        if: ${{ env.COOLIFY_WEBHOOK_BACKEND != '' }}
        run: |
          curl --fail --show-error --request GET "$COOLIFY_WEBHOOK_BACKEND" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
