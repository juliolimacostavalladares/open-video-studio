services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  qwenproxy:
    build:
      context: .
      dockerfile: Dockerfile.qwenproxy
      args:
        QWENPROXY_VERSION: v1.5.1
    environment:
      API_KEY: ${QWENPROXY_API_KEY:-sk-no-key-required}
      BROWSER: chromium
      PORT: 3000
      QWEN_EMAIL: ${QWEN_EMAIL:-}
      QWEN_PASSWORD: ${QWEN_PASSWORD:-}
    ports:
      - "${QWENPROXY_PORT:-3001}:3000"
    volumes:
      - qwenproxy-data:/app/data
      - qwenproxy-profiles:/app/qwen_profiles
    restart: unless-stopped
    shm_size: "2gb"

volumes:
  qwenproxy-data:
  qwenproxy-profiles:
