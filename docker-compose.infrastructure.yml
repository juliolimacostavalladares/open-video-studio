services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  qwenproxy:
    image: pedrofariasx/qwenproxy:latest
    container_name: qwenproxy
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - API_KEY=sk-no-key-required
      - QWEN_EMAIL=${QWEN_EMAIL:-}
      - QWEN_PASSWORD=${QWEN_PASSWORD:-}
      - BROWSER=chromium
    volumes:
      - ./data/qwenproxy:/app/data
      - ./data/qwen_profiles:/app/qwen_profiles
    restart: unless-stopped
